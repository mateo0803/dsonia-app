<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D' Sonia — Iniciar Sesión</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="/manifest.json">
</head>
<body class="bg-amber-50 flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-amber-100">
        <div class="text-center mb-8">
            <span class="text-4xl">🍗</span>
            <h1 class="text-2xl font-black text-amber-900 mt-2">D' Sonia</h1>
            <p class="text-sm text-amber-700 font-medium">Sistema de Gestión</p>
        </div>

        <form id="loginForm" class="space-y-6">
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">Usuario</label>
                <input type="text" id="username" required 
                    class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-amber-500 focus:outline-none text-lg"
                    placeholder="Ej. admin o trabajador">
            </div>

            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">Contraseña</label>
                <div class="relative">
                    <input type="password" id="password" required 
                        class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-amber-500 focus:outline-none text-lg pr-12"
                        placeholder="••••••••">
                    <button type="button" id="togglePassword" class="absolute right-3 top-3 text-gray-500 font-bold text-sm">
                        Ver
                    </button>
                </div>
            </div>

            <button type="submit" 
                class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-3.5 rounded-xl transition duration-200 text-lg shadow-lg shadow-amber-600/30">
                INGRESAR
            </button>
        </form>

        <div id="errorMessage" class="mt-4 text-center text-red-600 text-sm font-bold hidden"></div>
        <div class="mt-6 text-center text-xs text-gray-400">
            Credenciales de prueba: <br>Admin: <b>admin</b> / <b>1234</b> <br>Trabajador: <b>trabajador</b> / <b>1234</b>
        </div>
    </div>

    <script>
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');

        togglePassword.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            togglePassword.textContent = type === 'password' ? 'Ver' : 'Ocultar';
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const errDiv = document.getElementById('errorMessage');

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (data.success) {
                    localStorage.setItem('user', JSON.stringify(data.user));
                    window.location.href = '/dashboard';
                } else {
                    errDiv.textContent = data.message;
                    errDiv.classList.remove('hidden');
                }
            } catch (error) {
                errDiv.textContent = '❌ Error de conexión con el servidor.';
                errDiv.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
